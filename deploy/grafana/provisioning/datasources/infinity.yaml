# Grafana reads the Go API's JSON feeds through the Infinity datasource.
# In production this datasource becomes PostgreSQL/TimescaleDB (spec §2.1).
apiVersion: 1
datasources:
  - name: Rocateq API
    uid: rocateq-api
    type: yesoreyeram-infinity-datasource
    isDefault: true
    jsonData:
      allowedHosts:
        - http://host.docker.internal:8080
